# Render — Infra as Code do Fixly (sistema-web)
# Ao conectar o repositório no Render, ele detecta este arquivo (Blueprint).
#
# DOIS SERVIÇOS, O MESMO CÓDIGO:
#   fixly-web    → APP_ROLE=site   → fixly.company → o produto. /admin dá 404.
#   fixly-admin  → APP_ROLE=admin  → fixly.fun     → o painel. /app/* dá 404.
# A regra de quem serve o quê está em `src/lib/appRole.ts`, aplicada no `proxy.ts`.
#
# ⚠️ `APP_ROLE` é a única diferença obrigatória entre os dois. Se ela faltar, o
# serviço assume `site` de propósito: esquecer a variável nunca deve transformar
# o site público em painel.
services:
  # ── Site público ──────────────────────────────────────────
  - type: web
    name: fixly-web
    runtime: node
    plan: free           # troque para "starter" para evitar cold start
    region: oregon
    # `strip-admin` APAGA src/app/admin antes de compilar: as server actions do
    # painel não viram endpoints neste servidor. Ver o cabeçalho do script.
    buildCommand: node scripts/strip-admin.mjs && npm ci && npm run build
    startCommand: npm start
    # `/api/health` e nao `/login`: o health check e o que decide QUANDO o
    # Render passa a mandar trafego para a instancia nova. `/login` e uma
    # pagina inteira (render + proxy + Supabase), entao ela demora mais a
    # responder no boot — e cada segundo a mais e um segundo em que as
    # requisicoes de verdade morrem sem resposta.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: APP_ROLE
        value: site
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_ADMIN_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Pagamento — só o site cobra. O painel não recebe estas.
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: NEXT_PUBLIC_MP_PUBLIC_KEY
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      # ── Carteiras (Apple Pay / Google Pay) ──────────────────
      # Rodam no STRIPE, não no Mercado Pago — o MP não oferece esses meios no
      # Brasil (ver `lib/stripe.ts`). Sem estas três, `walletPaymentsEnabled()`
      # devolve falso e o botão "Carteira" simplesmente não aparece: nada
      # quebra, a opção só não existe.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      # Conteúdo do arquivo que a Apple exige em
      # /.well-known/apple-developer-merchantid-domain-association — o Stripe
      # entrega esse texto ao registrar o domínio. SÓ o Apple Pay depende dele;
      # o Google Pay funciona sem. Ver a rota de mesmo nome em `src/app`.
      - key: APPLE_PAY_DOMAIN_ASSOCIATION
        sync: false

  # ── Painel da equipe ──────────────────────────────────────
  # Repare no que NÃO está aqui: nenhuma credencial do Mercado Pago. O painel
  # não chama a API do gateway (só lê colunas de `payments`), então não há
  # motivo para o token existir nessa máquina.
  - type: web
    name: fixly-admin
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # `/api/health` e nao `/login`: o health check e o que decide QUANDO o
    # Render passa a mandar trafego para a instancia nova. `/login` e uma
    # pagina inteira (render + proxy + Supabase), entao ela demora mais a
    # responder no boot — e cada segundo a mais e um segundo em que as
    # requisicoes de verdade morrem sem resposta.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: APP_ROLE
        value: admin
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # No painel, a URL pública dele mesmo (links de e-mail saem corretos)
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # aprovação/reprovação de cadastro avisa o candidato por e-mail
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
